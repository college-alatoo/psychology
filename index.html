<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт согласий родителей — IT & Business College</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-file-signature"></i> Учёт согласий 2026
            </h1>
            <button onclick="toggleAdmin()" id="adminBtn" class="bg-indigo-800 hover:bg-indigo-900 text-sm px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-lock"></i> Админ
            </button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Секция поиска студента -->
        <div id="studentSection" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Согласие родителей на психологическое сопровождение</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Выберите группу:</label>
                    <select id="groupSelect" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="ACO-26">ACO-26 (Куратор: Nurzhan Nazarkulova)</option>
                        <option value="SCA-26A">SCA-26A (Куратор: Dosbol Aliev)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Поиск студента по ФИО или ID:</label>
                    <input type="text" id="searchInput" placeholder="Введите фамилию или ID студента" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <!-- Список студентов -->
            <div id="studentsList" class="divide-y divide-gray-100 max-h-96 overflow-y-auto border border-gray-100 rounded-xl p-2">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- Панель Администратора (скрыта по умолчанию) -->
        <div id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700"><i class="fa-solid fa-chart-pie text-indigo-600"></i> Статистика и отчеты</h2>
                <button onclick="resetData()" class="text-red-600 hover:text-red-800 text-sm font-medium">Сбросить все отметки</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                    <p class="text-xs text-indigo-500 font-semibold uppercase">Всего студентов</p>
                    <p id="totalCount" class="text-2xl font-bold text-indigo-700">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                    <p class="text-xs text-green-500 font-semibold uppercase">Согласие есть</p>
                    <p id="passedCount" class="text-2xl font-bold text-green-700">0</p>
                </div>
                <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                    <p class="text-xs text-orange-500 font-semibold uppercase">Согласия нет</p>
                    <p id="leftCount" class="text-2xl font-bold text-orange-700">0</p>
                </div>
            </div>

            <!-- Прогресс бар -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-green-600 h-4 transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-500 text-right">0% согласий</p>
        </div>

    </main>

    <!-- Подвал -->
    <footer class="text-center py-4 text-xs text-gray-400">
        Ala-Too IT & Business College &copy; 2026
    </footer>

    <script>
        // Данные студентов на основе таблицы
        let studentsData = []; // Загружается из students.json в GitHub

        // Временное локальное хранение статусов сохраняется до подключения Supabase.
        let savedStatuses = JSON.parse(localStorage.getItem('consent_statuses')) || {};

        const groupSelect = document.getElementById('groupSelect');
        const searchInput = document.getElementById('searchInput');
        const studentsList = document.getElementById('studentsList');

        function renderStudents() {
            const selectedGroup = groupSelect.value;
            const query = searchInput.value.toLowerCase().trim();

            studentsList.innerHTML = '';

            const filtered = studentsData.filter(s => {
                const matchGroup = s.group === selectedGroup;
                const matchQuery = s.name.toLowerCase().includes(query);
                return matchGroup && matchQuery;
            });

            if (filtered.length === 0) {
                studentsList.innerHTML = '<p class="text-center text-gray-400 py-4">Студенты не найдены в выбранной группе</p>';
                return;
            }

            filtered.forEach(student => {
                const div = document.createElement('div');
                div.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-3 py-3 px-2 hover:bg-gray-50 rounded-lg transition";
                div.innerHTML = `
                    <div>
                        <p class="font-medium text-gray-800">${student.name}</p>
                        <p class="text-xs text-gray-400">Группа: ${student.group}</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setConsent('${student.key}', true)" class="px-3 py-1.5 rounded-lg text-sm font-medium transition ${student.consent === true ? 'bg-green-100 text-green-700 ring-2 ring-green-500' : 'bg-gray-100 text-gray-600 hover:bg-green-50'}">✓ Согласие есть</button>
                        <button onclick="setConsent('${student.key}', false)" class="px-3 py-1.5 rounded-lg text-sm font-medium transition ${student.consent === false ? 'bg-red-100 text-red-700 ring-2 ring-red-500' : 'bg-gray-100 text-gray-600 hover:bg-red-50'}">✕ Согласия нет</button>
                    </div>
                `;
                studentsList.appendChild(div);
            });

            updateAdminStats();
        }

        function setConsent(id, value) {
            const student = studentsData.find(s => s.key === id);
            if (!student) return;
            student.consent = value;
            savedStatuses[student.key] = value;
            localStorage.setItem('consent_statuses', JSON.stringify(savedStatuses));
            renderStudents();
        }

        function updateAdminStats() {
            const total = studentsData.length;
            const passed = studentsData.filter(s => s.consent === true).length;
            const left = studentsData.filter(s => s.consent === false).length;
            const percent = total > 0 ? Math.round((passed / total) * 100) : 0;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('passedCount').innerText = passed;
            document.getElementById('leftCount').innerText = left;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '% согласий';
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const password = prompt('Введите пароль администратора (по умолчанию: 123):');
                if (password === '123' || password === 'admin') {
                    panel.classList.remove('hidden');
                } else if (password !== null) {
                    alert('Неверный пароль!');
                }
            } else {
                panel.classList.add('hidden');
            }
        }

        function resetData() {
            if (confirm('Вы уверены, что хотите сбросить все отметки согласия?')) {
                localStorage.removeItem('consent_statuses');
                studentsData.forEach(s => s.consent = null);
                savedStatuses = {};
                renderStudents();
            }
        }

        groupSelect.addEventListener('change', renderStudents);
        searchInput.addEventListener('input', renderStudents);

        // Загружаем список студентов из отдельного файла в GitHub Pages.
        async function loadStudents() {
            studentsList.innerHTML = '<p class="text-center text-gray-400 py-4">Загрузка студентов…</p>';
            try {
                const response = await fetch('./students.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Не удалось загрузить students.json (' + response.status + ')');
                const rows = await response.json();
                if (!Array.isArray(rows)) throw new Error('Файл students.json имеет неверный формат');
                studentsData = rows.map(s => ({
                    name: String(s.name ?? ''),
                    group: String(s.group ?? ''),
                    course: String(s.course ?? ''),
                    curator: String(s.curator ?? ''),
                    key: String(s.group ?? '') + '::' + String(s.name ?? ''),
                    consent: Object.prototype.hasOwnProperty.call(savedStatuses, String(s.group ?? '') + '::' + String(s.name ?? '')) ? savedStatuses[String(s.group ?? '') + '::' + String(s.name ?? '')] : null
                }));
                const groups = [...new Set(studentsData.map(s => s.group).filter(Boolean))];
                const previousGroup = groupSelect.value;
                groupSelect.replaceChildren();
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group;
                    option.textContent = group;
                    groupSelect.appendChild(option);
                });
                if (groups.includes(previousGroup)) groupSelect.value = previousGroup;
                renderStudents();
            } catch (error) {
                console.error('Ошибка загрузки списка студентов:', error);
                studentsList.innerHTML = '<p class="text-center text-red-600 py-4">Не удалось загрузить список студентов. Проверьте файл students.json в GitHub.</p>';
            }
        }

        // Первый запуск
        loadStudents();
    </script>
</body>
</html>
